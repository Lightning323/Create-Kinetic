dependencies {
    //Create
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    implementation "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    // Optional compat jars are Forge/older NeoForge; keep as compile-only for API references only
    compileOnly "curse.maven:createdieselgenerators-869316:6920093"
    compileOnly "curse.maven:createindustry-693815:7236535"
    //CC
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}"
    //JEI
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:19.25.0.322"
    //KFF
    implementation "thedarkcolour:kotlinforforge-neoforge:5.9.0"

    //KubeJS API (optional; used for script globals integration)
    compileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"

    //Mixin Extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"

    //Sable
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")
    implementation "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
//    compileOnly "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"
//    runtimeOnly files("libs/sable-neoforge-${minecraft_version}-${sable_version}.jar")

    //Simulated https://maven.ryanhcode.dev/#/releases/dev/ryanhcode
    //https://maven.ryanhcode.dev/#/releases/dev/simulated_team/simulated/simulated-neoforge-1.21.1
    implementation "dev.simulated_team.simulated:simulated-neoforge-1.21.1:${simulated_version}"

    //https://maven.ryanhcode.dev/#/releases/dev/eriksonn/aeronautics/aeronautics-neoforge-1.21.1
    implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-1.21.1:${aeronautics_version}")
//    implementation files("libs/create-aeronautics-bundled-${minecraft_version}-${aeronautics_version}.jar")

    //https://maven.ryanhcode.dev/#/releases/dev/ryanhcode/offroad/offroad-neoforge-1.21.1/1.2.1
    implementation "dev.ryanhcode.offroad:offroad-neoforge-1.21.1:${offroad_version}"

//    compileOnly files("libs/simulated-neoforge-${minecraft_version}-${simulated_version}.jar")
//

    //other
    runtimeOnly files("libs/createaddition-1.5.10.jar")
    runtimeOnly files("libs/Jade-${minecraft_version}-NeoForge-15.10.5.jar")
    runtimeOnly "curse.maven:forge-config-api-port-547434:7213611"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.18.2"
    implementation "org.joml:joml-primitives:1.10.0"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
