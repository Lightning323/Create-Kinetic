plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    localRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
configurations.runtimeClasspath.extendsFrom(configurations.localRuntime)

repositories {
    mavenLocal()

    maven {
        url = "https://modmaven.dev/"
    }

    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }

    maven {
        name = "CurseForge Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        name = "create maven"
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.simibubi.create")
            includeGroup("com.jozufozu.flywheel")
        }
    }
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
//    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        name = "CreateMaven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }

    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Latvian Maven"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup("dev.latvian.mods")
            includeGroup("dev.latvian.apps")
        }
    }
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
        content {
            includeGroup("com.github.rtyley")
        }
    }
    maven {
        name = "Kotlin for Forge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
        content {
            includeGroup("thedarkcolour")
        }
    }

    maven {
        name = "Squiddev maven cct"
        url = "https://maven.squiddev.cc/"
        content {
            includeGroup("cc.tweaked")
            includeModule("org.squiddev", "Cobalt")
        }
    }

    //Mixin^2
    maven {
        url = "https://maven.bawnorton.com/releases"
        content {
            includeGroup("com.github.bawnorton")
        }
    }
    maven {
        url = "https://maven.enjarai.dev/mirrors"
        content {
            includeGroup("io.github.llamalad7")
            includeGroup("com.github.bawnorton")
        }
    }
    maven {
        name = "SquidDev"
        url = "https://maven.squiddev.cc"
        content {
            includeGroup "cc.tweaked"
        }
    } //CC Tweaked
}

dependencies {
    //Create
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        exclude group: "dev.ftb.mods", module: "ftb-chunks-neoforge"
        exclude group: "dev.ftb.mods", module: "ftb-teams-neoforge"
        exclude group: "dev.ftb.mods", module: "ftb-library-neoforge"
        exclude group: "info.journeymap", module: "journeymap-api-neoforge"
        exclude group: "dev.architectury", module: "architectury-neoforge"
    }
    implementation ("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    implementation "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    // Optional compat jars are Forge/older NeoForge; keep as compile-only for API references only
    compileOnly "curse.maven:createdieselgenerators-869316:6920093"
    compileOnly "curse.maven:createindustry-693815:7236535"
    //CC
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}"
    //JEI
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:19.25.0.322"
    //KFF
    implementation "thedarkcolour:kotlinforforge-neoforge:5.9.0"

    //KubeJS API (optional; used for script globals integration)
    compileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"
    runtimeOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"

    //Mixin Extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"

    //Sable
//    def veil = "foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}"
//    compileOnly(veil)
//    implementation(veil) {
//        exclude group: 'maven.modrinth'
//        exclude group: 'me.fallenbreath'
//    }
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
//            {
//        exclude group: 'foundry.veil'
//    }
    api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")
//    compileOnly "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"
//    runtimeOnly files("libs/sable-neoforge-${minecraft_version}-${sable_version}.jar")

    //Simulated
    compileOnly files("libs/simulated-neoforge-${minecraft_version}-1.1.3.jar")
    runtimeOnly files("libs/create-aeronautics-bundled-${minecraft_version}-1.1.3.jar")
    implementation "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

    //other
    runtimeOnly files("libs/createaddition-1.5.10.jar")
    runtimeOnly files("libs/Jade-${minecraft_version}-NeoForge-15.10.5.jar")
    runtimeOnly "curse.maven:forge-config-api-port-547434:7213611"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.18.2"
    implementation "org.joml:joml-primitives:1.10.0"
}


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}